name: Sauvegarde quotidienne

# Sauvegarde logique chiffrée de la base de production, puis test de restauration
# dans une base PostgreSQL éphémère. Un échec envoie la notification GitHub habituelle
# (e-mail aux administrateurs du dépôt) : c'est l'alerte « sauvegarde échouée ».
on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC chaque nuit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: restore
          POSTGRES_PASSWORD: restore
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U restore" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la configuration
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Secrets BACKUP_DATABASE_URL et BACKUP_PASSPHRASE requis (voir docs/SAUVEGARDES.md)."
            exit 1
          fi
      - name: Client PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Sauvegarde chiffrée
        run: scripts/backup.sh backups
      - name: Test de restauration
        env:
          RESTORE_ADMIN_URL: postgresql://restore:restore@localhost:5432/postgres
        run: |
          file="$(ls backups/*.dump.enc)"
          psql "$RESTORE_ADMIN_URL" -qc "create database verification"
          RESTORE_DATABASE_URL=postgresql://restore:restore@localhost:5432/verification scripts/restore.sh "$file"
          for t in '"user"' project task opportunity cost_item audit_event; do
            echo "$t : $(psql postgresql://restore:restore@localhost:5432/verification -Atc "select count(*) from $t") lignes"
          done
      - name: Conserver la sauvegarde (chiffrée, 30 jours)
        uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-${{ github.run_id }}
          path: backups/
          retention-days: 30
