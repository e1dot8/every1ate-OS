name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: e1
          POSTGRES_PASSWORD: e1
          POSTGRES_DB: every1ate_os
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U e1" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Base jetable propre au job CI — aucune donnée réelle.
      DATABASE_URL: postgresql://e1:e1@localhost:5432/every1ate_os
      DIRECT_DATABASE_URL: postgresql://e1:e1@localhost:5432/every1ate_os
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests unitaires
        run: pnpm test
      - name: Migrations
        run: pnpm db:deploy && pnpm db:status
      - name: Build
        run: pnpm build
      - name: Aucun secret dans le bundle client
        run: pnpm check:bundle
      - name: Navigateur Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Tests end-to-end
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
