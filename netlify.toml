# Every1.ate OS — déploiement Netlify (site distinct du site vitrine).
# Next.js est détecté automatiquement par le runtime Next.js de Netlify (OpenNext).

[build]
  command = "pnpm run build:netlify"   # prisma generate + migrate deploy + next build
  publish = ".next"
  # Garde-fou crédits (ADR-0007) : un déploiement de PRODUCTION coûte 15 crédits.
  # Il n'est lancé que si le dernier commit contient « [deploy] ». Sinon, Netlify
  # annule le build (exit 0 = ignorer), ce qui ne consomme aucun crédit.
  # Deploy previews et branch deploys (gratuits) ne sont jamais bloqués.
  ignore = "bash scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "22"
  # Les migrations s'exécutent pendant le build : elles n'appliquent que les
  # migrations versionnées (jamais de reset). DATABASE_URL / DIRECT_DATABASE_URL
  # sont définies par contexte dans l'interface Netlify (production ≠ previews).

# Les deploy previews et branch deploys ne migrent PAS la base :
# ils utilisent leur propre base (branche Neon) définie dans Netlify.
[context.deploy-preview]
  command = "pnpm run build"

[context.branch-deploy]
  command = "pnpm run build"

[functions]
  directory = "netlify/functions"
